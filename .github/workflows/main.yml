name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Native IPA
        run: |
          mkdir -p Payload/DailyLedger.app
          HTML_FILE=$(find . -maxdepth 1 -type f \( -iname "*.html" -o -iname "*.htm" \) | head -n 1)
          B64_HTML=$(base64 < "$HTML_FILE" | tr -d '\r\n')
          echo "#define HTML_BASE64 \"$B64_HTML\"" > html_data.h

          echo '#import <UIKit/UIKit.h>' > main.m
          echo '#import <WebKit/WebKit.h>' >> main.m
          echo '#import <AudioToolbox/AudioToolbox.h>' >> main.m
          echo '#import "html_data.h"' >> main.m
          echo '@interface ViewController : UIViewController <WKScriptMessageHandler>' >> main.m
          echo '@property (nonatomic, strong) WKWebView *webView;' >> main.m
          echo '@end' >> main.m
          echo '@implementation ViewController' >> main.m
          echo '- (void)viewDidLoad {' >> main.m
          echo '    [super viewDidLoad];' >> main.m
          echo '    self.view.backgroundColor = [UIColor blackColor];' >> main.m
          echo '    WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];' >> main.m
          echo '    WKUserContentController *ucc = [[WKUserContentController alloc] init];' >> main.m
          echo '    for (NSString *name in @[@"vibrate", @"haptic", @"tap", @"sound", @"bridge", @"ios", @"native", @"feedback"]) {' >> main.m
          echo '        [ucc addScriptMessageHandler:self name:name];' >> main.m
          echo '    }' >> main.m
          echo '    NSString *js = @"window.vibrate = function(){ window.webkit.messageHandlers.vibrate.postMessage(1519); }; navigator.vibrate = window.vibrate; window.triggerHaptic = window.vibrate; try { const orig = window.webkit.messageHandlers; const proxy = new Proxy(orig, { get(t, p) { return t[p] || t.vibrate; } }); Object.defineProperty(window.webkit, \"messageHandlers\", { get: () => proxy }); } catch(e) {}";' >> main.m
          echo '    WKUserScript *script = [[WKUserScript alloc] initWithSource:js injectionTime:WKUserScriptInjectionTimeAtDocumentStart forMainFrameOnly:NO];' >> main.m
          echo '    [ucc addUserScript:script];' >> main.m
          echo '    config.userContentController = ucc;' >> main.m
          echo '    self.webView = [[WKWebView alloc] initWithFrame:self.view.bounds configuration:config];' >> main.m
          echo '    self.webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;' >> main.m
          echo '    self.webView.opaque = NO;' >> main.m
          echo '    self.webView.backgroundColor = [UIColor blackColor];' >> main.m
          echo '    self.webView.scrollView.backgroundColor = [UIColor blackColor];' >> main.m
          echo '    self.webView.scrollView.bounces = NO;' >> main.m
          echo '    if (@available(iOS 11.0, *)) {' >> main.m
          echo '        self.webView.scrollView.contentInsetAdjustmentBehavior = UIScrollViewContentInsetAdjustmentNever;' >> main.m
          echo '    }' >> main.m
          echo '    [self.view addSubview:self.webView];' >> main.m
          echo '    NSData *data = [[NSData alloc] initWithBase64EncodedString:[NSString stringWithUTF8String:HTML_BASE64] options:NSDataBase64DecodingIgnoreUnknownCharacters];' >> main.m
          echo '    NSString *html = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];' >> main.m
          echo '    [self.webView loadHTMLString:html baseURL:[NSURL URLWithString:@"https://localhost"]];' >> main.m
          echo '}' >> main.m
          echo '- (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {' >> main.m
          echo '    SystemSoundID soundID = 1519;' >> main.m
          echo '    if ([message.body isKindOfClass:[NSNumber class]]) {' >> main.m
          echo '        int val = [message.body intValue];' >> main.m
          echo '        if (val >= 1000 && val <= 2000) soundID = (SystemSoundID)val;' >> main.m
          echo '    }' >> main.m
          echo '    AudioServicesPlaySystemSound(soundID);' >> main.m
          echo '}' >> main.m
          echo '- (UIStatusBarStyle)preferredStatusBarStyle { return UIStatusBarStyleLightContent; }' >> main.m
          echo '@end' >> main.m
          echo '@interface AppDelegate : UIResponder <UIApplicationDelegate>' >> main.m
          echo '@property (strong, nonatomic) UIWindow *window;' >> main.m
          echo '@end' >> main.m
          echo '@implementation AppDelegate' >> main.m
          echo '- (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {' >> main.m
          echo '    self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];' >> main.m
          echo '    self.window.rootViewController = [[ViewController alloc] init];' >> main.m
          echo '    [self.window makeKeyAndVisible];' >> main.m
          echo '    return YES;' >> main.m
          echo '}' >> main.m
          echo '@end' >> main.m
          echo 'int main(int argc, char * argv[]) {' >> main.m
          echo '    @autoreleasepool { return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class])); }' >> main.m
          echo '}' >> main.m

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -fobjc-arc -isysroot "$SDK_PATH" -arch arm64 -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation -framework WebKit -framework AudioToolbox -framework CoreGraphics \
            main.m -o Payload/DailyLedger.app/DailyLedger

          echo '<?xml version="1.0" encoding="UTF-8"?>' > Payload/DailyLedger.app/Info.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Payload/DailyLedger.app/Info.plist
          echo '<plist version="1.0"><dict>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>CFBundleExecutable</key><string>DailyLedger</string>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>CFBundleIdentifier</key><string>com.daily.ledger</string>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>CFBundleName</key><string>DailyLedger</string>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>CFBundleDisplayName</key><string>DailyLedger</string>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>CFBundleVersion</key><string>1.0</string>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>CFBundleShortVersionString</key><string>1.0</string>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>CFBundlePackageType</key><string>APPL</string>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>LSRequiresIPhoneOS</key><true/>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>MinimumOSVersion</key><string>14.0</string>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>UILaunchScreen</key><dict/>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>' >> Payload/DailyLedger.app/Info.plist
          echo '<key>NSAppTransportSecurity</key><dict><key>NSAllowsArbitraryLoads</key><true/></dict>' >> Payload/DailyLedger.app/Info.plist
          echo '</dict></plist>' >> Payload/DailyLedger.app/Info.plist

          codesign -f -s - Payload/DailyLedger.app
          zip -r DailyLedger.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DailyLedger-IPA
          path: DailyLedger.ipa
